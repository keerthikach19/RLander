name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    env:
      JAX_PLATFORMS: cpu
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install CPU runtime and app
        run: python -m pip install "jax[cpu]" flax optax orbax-checkpoint hydra-core gymnasium pandas pyarrow sqlalchemy pytest ruff streamlit plotly numpy pyyaml
      - name: Lint
        run: python -m ruff check .
      - name: Tests
        run: python -m pytest -q
