[project]
name = "rlander"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Keerthika Ch", email = "cse23733002@matrusri.edu.in" }
]
requires-python = ">=3.11"
dependencies = [
    "flax>=0.12.8",
    "gymnasium>=1.4.0",
    "hydra-core>=1.3.7",
    "jax>=0.10.2",
    "openai>=3.31.0",
    "optax>=0.2.8",
    "orbax-checkpoint>=0.12.7",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "ruff>=0.17.1",
    "sqlalchemy>=2.1.4",
    "streamlit>=1.66.0",
    "tenacity>=9.2.1",
]

[project.scripts]
rlander = "rlander:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
